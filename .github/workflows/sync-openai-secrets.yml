name: Sync OpenAI secrets to backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-openai-secrets.yml'
      - 'tools/sync_openai_secrets.py'
      - 'tools/tests/test_openai_secret_sync.py'
  pull_request:
    paths:
      - '.github/workflows/sync-openai-secrets.yml'
      - 'tools/sync_openai_secrets.py'
      - 'tools/tests/test_openai_secret_sync.py'
  workflow_dispatch:
    inputs:
      operation:
        description: 'sync: replace backend key bundle; disable: clear it and redeploy'
        required: true
        default: sync
        type: choice
        options:
          - sync
          - disable

permissions:
  contents: read

concurrency:
  group: openai-backend-secret-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check delivery and public build without credentials
        run: python -B -m unittest discover -s tools/tests -p 'test_openai_secret_sync.py'
  sync:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.repository == '128june/KNOW-HOW' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Configure this environment to allow main only. Store the dedicated
    # KNOWHOW_BACKEND_SYNC_TOKEN here; OPENAI_API_KEY_N stays in repo Secrets.
    environment: backend-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Encrypt selected keys and request private backend deployment
        env:
          # Explicit slots prevent exposing unrelated repository secrets.
          # Never echo these values or add them to outputs, files, or artifacts.
          KNOWHOW_BACKEND_SYNC_TOKEN: ${{ secrets.KNOWHOW_BACKEND_SYNC_TOKEN }}
          OPENAI_API_KEY_1: ${{ secrets.OPENAI_API_KEY_1 }}
          OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3: ${{ secrets.OPENAI_API_KEY_3 }}
          OPENAI_API_KEY_4: ${{ secrets.OPENAI_API_KEY_4 }}
          OPENAI_API_KEY_5: ${{ secrets.OPENAI_API_KEY_5 }}
          OPENAI_API_KEY_6: ${{ secrets.OPENAI_API_KEY_6 }}
          OPENAI_API_KEY_7: ${{ secrets.OPENAI_API_KEY_7 }}
          OPENAI_API_KEY_8: ${{ secrets.OPENAI_API_KEY_8 }}
          OPENAI_API_KEY_9: ${{ secrets.OPENAI_API_KEY_9 }}
          OPENAI_API_KEY_10: ${{ secrets.OPENAI_API_KEY_10 }}
          OPENAI_API_KEY_11: ${{ secrets.OPENAI_API_KEY_11 }}
          OPENAI_API_KEY_12: ${{ secrets.OPENAI_API_KEY_12 }}
          OPENAI_API_KEY_13: ${{ secrets.OPENAI_API_KEY_13 }}
          OPENAI_API_KEY_14: ${{ secrets.OPENAI_API_KEY_14 }}
          OPENAI_API_KEY_15: ${{ secrets.OPENAI_API_KEY_15 }}
          OPENAI_API_KEY_16: ${{ secrets.OPENAI_API_KEY_16 }}
          OPENAI_API_KEY_17: ${{ secrets.OPENAI_API_KEY_17 }}
          OPENAI_API_KEY_18: ${{ secrets.OPENAI_API_KEY_18 }}
          OPENAI_API_KEY_19: ${{ secrets.OPENAI_API_KEY_19 }}
          OPENAI_API_KEY_20: ${{ secrets.OPENAI_API_KEY_20 }}
          SYNC_OPERATION: ${{ inputs.operation }}
        run: python -B tools/sync_openai_secrets.py
